name: swara
description: Swara - Offline music player with automatic metadata, lyrics, and listening analytics dashboard.
publish_to: 'none'
version: 2.9.13+43

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Audio playback
  just_audio: ^0.9.40

  # Foreground service asli + kontrol lockscreen/notifikasi lewat MediaSession
  # Android (gantiin flutter_local_notifications yang lama, cuma notifikasi biasa)
  audio_service: ^0.18.15

  # Scan file lokal & baca tag ID3 dari file musik
  on_audio_query: ^2.9.0

  # Database lokal (riwayat dengar, cache metadata, lirik)
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Simpan preferensi (tema, dll) supaya tidak reset tiap app dibuka
  shared_preferences: ^2.3.2

  # HTTP untuk fetch metadata/album art/lirik dari API eksternal
  http: ^1.2.2

  # Permission storage
  permission_handler: ^11.3.1

  # Format tanggal untuk dashboard
  intl: ^0.20.3

  # Buka link eksternal (cari lirik di Google)
  url_launcher: ^6.3.1
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  image: ^4.12.0
  equalizer_flutter: ^0.0.1
  quick_actions: ^1.1.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/swara-mark.png
