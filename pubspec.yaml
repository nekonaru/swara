name: swara
description: Swara - Offline music player with automatic metadata, lyrics, and listening analytics dashboard.
publish_to: 'none'
version: 3.3.0+47

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Audio playback
  just_audio: ^0.9.40

  # Foreground service + native MediaSession controls
  # (replaces the old flutter_local_notifications setup)
  audio_service: ^0.18.15

  # Local file scanning & ID3 tag reading
  on_audio_query: ^2.9.0

  # Local database (listening history, metadata cache, lyrics)
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Persisted preferences (theme, etc.) so they survive restarts
  shared_preferences: ^2.3.2

  # HTTP for fetching metadata/art/lyrics from external APIs
  http: ^1.2.2

  # Storage permission
  permission_handler: ^11.3.1

  # Date formatting for the dashboard
  intl: ^0.20.3

  # Open external links (lyrics search)
  url_launcher: ^6.3.1
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  image: ^4.12.0
  equalizer_flutter: ^0.0.1
  quick_actions: ^1.1.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/swara-mark.png
