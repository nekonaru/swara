name: Build & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Cache pub and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle
          key: ${{ runner.os }}-flutter-3.47.0-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-3.47.0-

      - name: Patch legacy plugins missing a namespace (AGP 8+)
        # equalizer_flutter and on_audio_query ship a build.gradle without a
        # namespace, which AGP 8+ refuses to configure. The app code itself
        # needs no patching: the whole Android project lives in android/.
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp android/gradle-init/fix-namespace.gradle "$HOME/.gradle/init.d/"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Verify split APK outputs exist
        run: |
          rm -f build/app/outputs/flutter-apk/*x86_64*.apk
          DEST="build/app/outputs/flutter-apk"
          echo "=== APK outputs in $DEST ==="
          ls -la "$DEST"
          COUNT=$(ls "$DEST"/app-*-release.apk 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "No app-*-release.apk found in $DEST"
            exit 1
          fi
          echo "Found $COUNT split APK(s)."

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION | Build: $BUILD"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-app-apks
          path: build/app/outputs/flutter-apk/*.apk

      # The release is published only on v* tag pushes. A plain push to
      # main just builds the APKs.
      - name: Generate the release body from CHANGELOG.md and CHANGELOG.id.md
        if: startsWith(github.ref, 'refs/tags/v')
        # The release body is assembled from the two changelog files so the
        # notes can never drift away from the changelog. No release notes
        # text lives in this workflow; only the fixed Install / Update blocks
        # (which must match README Installation, Option A) live in the script.
        run: python3 scripts/release_body.py "${{ steps.version.outputs.version }}" release-body.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Swara v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: release-body.md
          files: |
            build/app/outputs/flutter-apk/app-*-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
