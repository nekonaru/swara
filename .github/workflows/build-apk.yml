name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Cache pub and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle
          key: ${{ runner.os }}-flutter-3.47.0-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-3.47.0-

      - name: Patch legacy plugins missing a namespace (AGP 8+)
        # on_audio_query ships a build.gradle without a
        # namespace, which AGP 8+ refuses to configure. The app code itself
        # needs no patching: the whole Android project lives in android/.
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp android/gradle-init/fix-namespace.gradle "$HOME/.gradle/init.d/"

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release signing key
        # CI uses one pinned release key so in-app updates keep the same
        # signing certificate. The keystore never lives in the repository.
        env:
          SWARA_KEYSTORE_B64: ${{ secrets.SWARA_KEYSTORE_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$SWARA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/signing/swara-release.jks"
          test -s "$RUNNER_TEMP/signing/swara-release.jks"

      - name: Build APK
        env:
          SWARA_KEYSTORE_PATH: ${{ runner.temp }}/signing/swara-release.jks
          SWARA_STORE_PASSWORD: ${{ secrets.SWARA_STORE_PASSWORD }}
          SWARA_KEY_ALIAS: ${{ secrets.SWARA_KEY_ALIAS }}
          SWARA_KEY_PASSWORD: ${{ secrets.SWARA_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64 --obfuscate --split-debug-info=build/symbols

      - name: Verify split APK outputs exist
        run: |
          DEST="build/app/outputs/flutter-apk"
          echo "=== APK outputs in $DEST ==="
          ls -la "$DEST"
          COUNT=$(ls "$DEST"/app-*-release.apk 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "No app-*-release.apk found in $DEST"
            exit 1
          fi
          echo "Found $COUNT split APK(s)."

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-app-apks
          path: build/app/outputs/flutter-apk/*.apk
